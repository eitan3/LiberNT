#
# PROJECT:     LiberNT Intel Smart Sound DSP driver
# LICENSE:     GPL-3.0-or-later (https://spdx.org/licenses/GPL-3.0-or-later)
# PURPOSE:     The loopback test topology in the object syntax the pre-processor of alsatplg reads: one pipeline whose host playback copier feeds a gain whose output a host capture copier writes back to the host
# COPYRIGHT:   Copyright 2026 LiberNT contributors
#
# build.sh compiles this with the topology2 classes of Sound Open Firmware
# (https://github.com/thesofproject/sof, BSD-3-Clause, Intel) at the revision it
# names. This file is the project's own text and copies none of theirs: it
# instantiates their classes (host-gateway-playback, host-copier, gain, pcm,
# route); their classes write the copier UUIDs, the node type values, the token
# numbers and the widget layouts, and their get_abi.sh emits the manifest.
#
# What the plan asks of this file: the PCM "Loopback" plays and captures at
# 48 kHz in two channels with 16, 24-in-32 and 32 bits; the host playback copier
# offers the three input formats the shipped copiers offer (16, 24-in-32, 32
# bits); the host capture copier writes 24-in-32, 32 and 16 bits; the gain sits
# between them, at the unity value its class initialises, with a volume and a
# switch control so that the endpoint's volume and mute nodes have something
# to drive. The two controls carry names because the pre-processor of
# alsa-utils 1.2.16 builds a control only when it has one, and a topology whose
# only controls are unnamed cannot be built.
#
# The scheduler is the shipped playback gateway's: priority 0, timer time
# domain, dynamic pipeline. Linux v6.12's IPC4 topology code reads no scheduler
# direction, and none is written here.
#

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/pipelines>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>

<vendor-token.conf>
<tokens.conf>
<virtual.conf>
<host-gateway-playback.conf>
<gain.conf>
<data.conf>
<pcm.conf>
<pcm_caps.conf>
<fe_dai.conf>
<manifest.conf>
<route.conf>
<common_definitions.conf>
<module-copier.conf>

Define {
	LOOPBACK_PCM_ID		0
	LOOPBACK_PIPELINE_ID	1
}

Object.Pipeline.host-gateway-playback [
	{
		Object.Widget.host-copier.1 {
			stream_name	"Loopback Playback"
			pcm_id		$LOOPBACK_PCM_ID
		}

		Object.Widget.gain.1 {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
			Object.Control.mixer.1 {
				name	"Loopback Volume"
			}
			Object.Control.mixer.2 {
				name	"Loopback Switch"
			}
		}

		Object.Widget.host-copier.2 {
			stream_name	"Loopback Capture"
			pcm_id		$LOOPBACK_PCM_ID
			direction	"capture"
			type		"aif_out"
			node_type	$HDA_HOST_INPUT_CLASS
			num_input_pins	1
			num_input_audio_formats 1
			num_output_audio_formats 3
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	24
				}
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
				{
					out_bit_depth		16
					out_valid_bit_depth	16
				}
			]
		}

		index	$LOOPBACK_PIPELINE_ID
	}
]

Object.PCM.pcm [
	{
		name		"Loopback"
		id		$LOOPBACK_PCM_ID
		direction	"duplex"

		Object.Base.fe_dai.1 {
			name	"Loopback"
		}

		Object.PCM.pcm_caps.1 {
			direction	"playback"
			name		"Loopback Playback"
			formats		'S16_LE,S24_LE,S32_LE'
			rates		'48000'
			channels_min	2
			channels_max	2
		}

		Object.PCM.pcm_caps.2 {
			direction	"capture"
			name		"Loopback Capture"
			formats		'S16_LE,S24_LE,S32_LE'
			rates		'48000'
			channels_min	2
			channels_max	2
		}
	}
]

Object.Base.route [
	{
		source	"host-copier.$LOOPBACK_PCM_ID.playback"
		sink	"gain.$LOOPBACK_PIPELINE_ID.1"
	}
	{
		source	"gain.$LOOPBACK_PIPELINE_ID.1"
		sink	"host-copier.$LOOPBACK_PCM_ID.capture"
	}
]
